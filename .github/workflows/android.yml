name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK to the v1.6 release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check mobile controls
        run: node --check game-src/mobile-controls.js

      - name: Build APK
        run: ./gradlew clean assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LastBreath-EP-Android-v1.6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: cp app/build/outputs/apk/debug/app-debug.apk LastBreath-EP-Android-v1.6.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          name: Last Breath EP Android v1.6
          body: |
            修复名字输入画面的键盘与 ENTER 按钮显示，支持精灵克隆场景。
            降低渲染开销，优化资源读取线程与 64 MB 缓存，加快游戏资源加载。
            APK 由 GitHub Actions 使用 clean assembleDebug 构建。
          files: LastBreath-EP-Android-v1.6.apk
          fail_on_unmatched_files: true
