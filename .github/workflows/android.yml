name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK to the v1.8 release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check encrypted game bundle
        run: python3 -c "assert open('game-src/game.bin', 'rb').read(8) == b'LBP2\\0\\0\\0\\1'"

      - name: Build APK
        run: ./gradlew clean assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: LastBreath-EP-Android-v1.8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LastBreath-EP-Android-v1.8-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Sign release APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          $ANDROID_HOME/build-tools/36.0.0/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk release-aligned.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out LastBreath-EP-Android-v1.8-release.apk release-aligned.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8
          name: Last Breath EP Android v1.8
          body: |
            Release 正式版隐藏 Debug 按钮，不启用无敌模式。
            Debug 构建提供左上角黄色开关，用于恢复 HP 和清除受击状态。
            game-src 仅包含 Git LFS 跟踪的加密 game.bin。
          files: LastBreath-EP-Android-v1.8-release.apk
          fail_on_unmatched_files: true
